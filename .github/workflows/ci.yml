name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装 FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: 安装依赖（不含桌面界面组件，界面渲染测试会自动跳过）
        run: pip install "httpx>=0.27,<1" "keyring>=25,<26" pytest pyflakes
      - name: 代码检查
        run: python -m pyflakes fupan tests
      - name: 自动测试
        run: python -m pytest -q
